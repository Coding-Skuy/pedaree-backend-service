name: ci
on: [push, pull_request]
jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions-rs/toolchain@v1.0.7
        with: { toolchain: 1.84.1, override: true }
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
